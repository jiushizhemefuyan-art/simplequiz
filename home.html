<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>英文單字比賽練習系統</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>英文單字比賽練習系統</h1>
        </header>
        <main>
            <div class="unit-list" id="unit-list"></div>
        </main>
    </div>
    <script src="data.js"></script>
    <script>
        // 【關鍵修復】定義 BASE_PATH 以確保所有連結 (包括 unit10.html) 正常運作
        const BASE_PATH = '';
        
        const unitList = document.getElementById('unit-list');
        
        // 確保 vocabByUnit 存在，避免錯誤
        if (typeof vocabByUnit !== 'undefined') {
            Object.keys(vocabByUnit).forEach(u=>{
                const card=document.createElement('div'); 
                card.className='unit-card';
                
                const title=document.createElement('div'); 
                title.innerHTML='<strong>'+u.toUpperCase()+'</strong>';
                
                const info=document.createElement('div'); 
                info.className='status'; 
                info.textContent=(vocabByUnit[u]||[]).length+' 單字 • 100 題';
                
                const controls=document.createElement('div'); 
                controls.className='controls';
                
                // 測驗模式按鈕
                const aBtn=document.createElement('button'); 
                aBtn.className='btn'; 
                aBtn.textContent='英翻中 (50題)'; 
                aBtn.onclick=()=>location.href=BASE_PATH+'quiz.html?u='+u+'&mode=a';
                
                const bBtn=document.createElement('button'); 
                bBtn.className='btn'; 
                bBtn.textContent='中翻英 (50題)'; 
                bBtn.onclick=()=>location.href=BASE_PATH+'quiz.html?u='+u+'&mode=b';
                
                const mBtn=document.createElement('button'); 
                mBtn.className='btn'; 
                mBtn.textContent='完整測驗 (100題)'; 
                mBtn.onclick=()=>location.href=BASE_PATH+'quiz.html?u='+u+'&mode=mix';
                
                // 輔助功能按鈕
                const fBtn=document.createElement('button'); 
                fBtn.className='btn ghost'; 
                fBtn.textContent='單字卡'; 
                fBtn.onclick=()=>location.href=BASE_PATH+'flashcards.html?u='+u;
                
                const vBtn=document.createElement('button'); 
                vBtn.className='btn ghost'; 
                vBtn.textContent='單字總覽'; 
                vBtn.onclick=()=>location.href=BASE_PATH+'vocab.html?u='+u;
                
                const wBtn=document.createElement('button'); 
                wBtn.className='btn ghost'; 
                wBtn.textContent='錯題本'; 
                wBtn.onclick=()=>location.href=BASE_PATH+'wrongbook.html?u='+u;
                
                // 10題模式按鈕
                const tBtn=document.createElement('button'); 
                tBtn.className='btn'; 
                tBtn.textContent='10題模式'; 
                tBtn.onclick=()=>location.href=BASE_PATH+'unit10.html?u='+u; 
                
                // 加入 controls
                controls.appendChild(aBtn); 
                controls.appendChild(bBtn); 
                controls.appendChild(mBtn); 
                controls.appendChild(fBtn); 
                controls.appendChild(vBtn); 
                controls.appendChild(wBtn);
                controls.appendChild(tBtn);
                
                // 加入 card
                card.appendChild(title); 
                card.appendChild(info); 
                card.appendChild(controls);
                unitList.appendChild(card);
            });
        } else {
            // 處理 data.js 未載入或 vocabByUnit 不存在的錯誤
            unitList.innerHTML = '<p>錯誤：無法載入單字資料 (data.js) 或單字結構錯誤。</p>';
        }
    </script>
</body>
</html>
