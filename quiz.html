<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>10 題測驗</title>
<link rel="stylesheet" href="styles.css"/>
</head>
<body>
<header class="site-header"><h1 id="title">測驗</h1></header>

<main class="container">
  <div id="question-area"></div>

  <div id="controls" class="controls" style="display:none;">
    <button id="prev" class="btn">上一題</button>
    <button id="next" class="btn">下一題</button>
    <span id="progress" class="progress"></span>
  </div>

  <p><a class="link" href="index.html">← 返回選單</a></p>
</main>

<script src="data.js"></script>
<script>
// 讀 URL 參數
function qp(n){ return new URL(location.href).searchParams.get(n); }

const unit = parseInt(qp("u")||"1",10);
const [start,end] = (qp("range")||"1-10").split("-").map(Number);

document.getElementById("title").innerText = `Unit ${unit}：${start}-${end}（10 題）`;

// 讀取正確題庫
const all = (window.vocabByUnit["unit"+unit] || []);

// 過濾範圍
let pool = all.filter(x => x.id>=start && x.id<=end);

// 若不足 10 題 → 從前面補
if(pool.length < 10){
  pool = pool.concat(all.slice(0, 10 - pool.length));
}

// 洗牌
function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
}
shuffle(pool);

// 取 10 題
const questions = pool.slice(0,10);

// 顯示控制
let idx = 0;
let answers = new Array(questions.length).fill(null);

const qArea = document.getElementById("question-area");
const controls = document.getElementById("controls");
const prevBtn = document.getElementById("prev");
const nextBtn = document.getElementById("next");
const progress = document.getElementById("progress");

// 渲染題目
function render(){
  if(idx<0) idx=0;
  if(idx>=questions.length) idx=questions.length-1;

  const q = questions[idx];

  qArea.innerHTML = `
    <div class="qbox">
      <h2>題 ${idx+1}</h2>
      <div class="prompt">${q.word}</div>
      <div class="meaning">(請選出正確中文意思)</div>
    </div>
  `;

  const opts = document.createElement("div");
  opts.className = "opts";

  // 建立四個選項
  let choices = [q.meaning];

  let others = all.filter(x => x.meaning !== q.meaning)
                  .sort(()=>Math.random()-0.5)
                  .slice(0,3)
                  .map(x => x.meaning);

  choices = choices.concat(others).sort(()=>Math.random()-0.5);

  q.options = choices;
  q.answerIndex = choices.indexOf(q.meaning);

  choices.forEach((c,i)=>{
    const b = document.createElement("button");
    b.className = "opt";
    b.textContent = c;

    if(answers[idx] === i) b.classList.add("selected");

    b.onclick = ()=>{ answers[idx]=i; render(); };

    opts.appendChild(b);
  });

  qArea.querySelector(".qbox").appendChild(opts);

  controls.style.display = "block";
  progress.textContent = `已答 ${answers.filter(x=>x!==null).length} / ${questions.length}`;

  prevBtn.disabled = (idx===0);
  nextBtn.textContent = (idx===questions.length-1)?"完成並看結果":"下一題";
}

// 顯示結果
function showResult(){
  let correct = 0;
  let html = '<h2>結果</h2><ol class="result-list">';

  for(let i=0;i<questions.length;i++){
    const q = questions[i];
    const a = answers[i];

    if(a === q.answerIndex) correct++;

    html += `
      <li>
        <div class="qtitle">${q.word}</div>
        <div>你的答案：${a===null?"-":q.options[a]}</div>
        <div>正確答案：${q.meaning}</div>
      </li>`;
  }

  html += `</ol><p class="score">得分：${correct} / ${questions.length}</p>
           <p><a class="btn" href="index.html">回選單</a></p>`;

  qArea.innerHTML = html;
  controls.style.display = "none";
}

prevBtn.onclick = ()=>{ idx--; render(); };
nextBtn.onclick = ()=>{
  if(idx===questions.length-1) showResult();
  else { idx++; render(); }
};

// 如果題庫空
if(questions.length===0){
  qArea.innerHTML = '<p>找不到題目，請確認 data.js 中有包含 unit 與 id 的題庫。</p>';
} else {
  render();
}
</script>
</body>
</html>
