<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>10 題測驗</title>
<link rel="stylesheet" href="styles.css"/>
</head>
<body>
<header class="site-header"><h1 id="title">測驗</h1></header>

<main class="container">
  <div id="meta"></div>
  <div id="question-area"></div>

  <div id="controls" class="controls" style="display:none;">
    <button id="prev" class="btn">上一題</button>
    <button id="next" class="btn">下一題</button>
    <span id="progress" class="progress"></span>
  </div>

  <p><a class="link" href="index.html">← 返回選單</a></p>
</main>

<script src="data.js"></script>
<script>
function qp(n){ return new URL(location.href).searchParams.get(n); }

const unit = parseInt(qp('u') || '1', 10);
const range = (qp('range') || '1-10').split('-').map(x=>parseInt(x));
const start = range[0], end = range[1];

const all = (vocabByUnit["unit" + unit] || []);

let pool = all.filter(x => x.id >= start && x.id <= end);

if(pool.length < 10){
  const extra = all.slice(0, 10 - pool.length);
  pool = pool.concat(extra);
}

function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random() * (i+1));
    [a[i], a[j]] = [a[j], a[i]];
  }
}
shuffle(pool);

const questions = pool.slice(0,10);

let idx = 0;
let answers = new Array(questions.length).fill(null);

const qArea = document.getElementById('question-area');
const controls = document.getElementById('controls');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');
const progress = document.getElementById('progress');

document.getElementById('title').innerText = `Unit ${unit}：${start}-${end}（10 題）`;

function render(){
  if(idx < 0) idx = 0;
  if(idx >= questions.length) idx = questions.length - 1;

  const q = questions[idx];
  qArea.innerHTML = '';

  const qBox = document.createElement('div');
  qBox.className = 'qbox';

  qBox.innerHTML = `
    <h2>題 ${idx+1}</h2>
    <div class="prompt">${q.word}</div>
    <div class="meaning">(請選出正確中文意思)</div>
  `;

  const opts = document.createElement('div');
  opts.className = 'opts';

  let options = [ q.meaning ];

  let others = all
    .filter(x=>x.meaning !== q.meaning)
    .sort(()=>Math.random()-0.5)
    .slice(0,3)
    .map(x=> x.meaning);

  options = options.concat(others).sort(()=>Math.random()-0.5);

  q.options = options;
  q.answerIndex = options.indexOf(q.meaning);

  options.forEach((c,i)=>{
    const b = document.createElement('button');
    b.className = 'opt btn';
    b.textContent = c;

    if(answers[idx] === i) b.classList.add('selected');

    b.onclick = ()=>{
      answers[idx] = i;
      render();
    };

    opts.appendChild(b);
  });

  qBox.appendChild(opts);
  qArea.appendChild(qBox);

  controls.style.display = 'block';
  progress.textContent = `已答 ${answers.filter(x=>x!==null).length} / ${questions.length}`;

  prevBtn.disabled = (idx === 0);
  nextBtn.textContent = (idx === questions.length-1) ? '完成並看結果' : '下一題';
}

prevBtn.onclick = ()=>{ idx--; render(); };
nextBtn.onclick = ()=>{
  if(idx === questions.length-1) showResult();
  else { idx++; render(); }
};

function showResult(){
  let correct = 0;
  let html = '<h2>結果</h2><ol class="result-list">';

  for(let i=0;i<questions.length;i++){
    const q = questions[i];
    const a = answers[i];

    if(a === q.answerIndex) correct++;

    html += `
      <li>
        <div class="qtitle">${q.word}</div>
        <div>你的答案：${a===null? '-' : q.options[a]}</div>
        <div>正確答案：${q.meaning}</div>
      </li>
    `;
  }

  html += `</ol><p class="score">得分：${correct} / ${questions.length}</p>
           <p><a class="btn" href="index.html">回選單</a></p>`;

  qArea.innerHTML = html;
  controls.style.display = 'none';
}

if(questions.length === 0){
  qArea.innerHTML = '<p>找不到題目，請確認 data.js 中有包含 unit 與 id 的題庫。</p>';
} else {
  render();
}
</script>
</body>
</html>
