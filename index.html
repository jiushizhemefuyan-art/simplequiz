<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>10 題測驗（綠色主題）</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<header class="site-header"><h1>英文單字──10 題練習</h1></header>
<main class="container">
  <p class="lead">每個 Unit 各有 10 段範圍。點選任意一個範圍開始測驗（會隨機排列題目）。</p>
  <div id="units" class="units-grid"></div>
</main>
<footer class="site-footer">練習系統 • 綠色主題</footer>

<script>
const UNITS = 10;
const unitsBox = document.getElementById('units');
for(let u=1; u<=UNITS; u++){
  const card = document.createElement('section');
  card.className = 'unit-card';
  const header = document.createElement('h2');
  header.textContent = 'Unit ' + u;
  const btnRow = document.createElement('div');
  btnRow.className = 'range-row';
  for(let s=1; s<=91; s+=10){
    const e = s+9;
    const a = document.createElement('a');
    a.className = 'range-btn';
    a.textContent = `${s}-${e}`;
    a.href = `quiz.html?u=${u}&range=${s}-${e}`;
    btnRow.appendChild(a);
  }
  card.appendChild(header);
  card.appendChild(btnRow);
  unitsBox.appendChild(card);
}
</script>
</body>
</html>
